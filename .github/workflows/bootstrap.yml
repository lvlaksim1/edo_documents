name: Bootstrap v0.3.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact v0.3.5 files
        shell: bash
        run: |
          cat .bootstrap/background.js.*.txt > background.js
          cat .bootstrap/content.js.*.txt > content.js

          test "$(git hash-object manifest.json)" = "1625a4e1dceee15b4594ce2dd0f3df3f3f4e2d7d"
          test "$(git hash-object README.txt)" = "c6545cb52b860ec505f6b28d3a3fed56ba49e36e"
          test "$(git hash-object offscreen.html)" = "ac41a9583ea51a74db1cae4ec84c80385a078965"
          test "$(git hash-object offscreen.js)" = "f52ce6c9d542b04b7bd564d58ae0ac00248d51ab"
          test "$(git hash-object background.js)" = "7351e052de3c934c8b8a9e5bdd09ff986d64be8d"
          test "$(git hash-object content.js)" = "144ed7bcbe7b3b492f51a79f3b716c0bc8438e41"

          node --check background.js
          node --check content.js
          node --check offscreen.js

      - name: Commit clean baseline
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish exact EDO Documents v0.3.5 baseline"
          git push
