name: Repository Storage Policy

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject oversized and forbidden tracked files
        run: python3 scripts/check_repository_storage.py

  hygiene:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt |
            jq -r 'sort_by(.publishedAt) | reverse | .[1:][]?.tagName' |
            while read -r tag; do
              [ -z "$tag" ] && continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
      - name: Delete Actions artifacts from completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.workflow_run.id // 0)] | @tsv' |
            while IFS=$'\t' read -r artifact_id run_id; do
              [ -z "$artifact_id" ] && continue
              if [ "$run_id" = "0" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                continue
              fi
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
              if [ "$status" = "completed" ]; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              fi
            done
